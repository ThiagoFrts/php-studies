<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Clientes</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="pai">
        <h1>Cadastrar Cliente </h1>
    </div>
    <br><br>
    <form action="cad.php" method="post">
        <div class="borda">
            <div class="campo">
                <label for="">Nome:</label>
                <input type="text" placeholder="Digite seu nome" required maxlength="30" name="Nome">

                <label for="">Telefone:</label>
                <input type="tel" maxlength="15" placeholder="Digite seu Telefone" required name="Telefone">

                <label for="">Email:</label>
                <input type="email" placeholder="Digite seu Email" required name="Email">
                <label for="cidade">Cidade:</label>
                <select name="cidade" id="">
                    <option selected disabled value="">Selecione uma opção</option>
                    <option value="Belo Horizonte">Belo Horizonte</option>
                    <option value="Nova Lima">Nova Lima</option>
                    <option value="Justinópolis">Justinópolis</option>
                    <option value="Jõao Molevade">Jõao Molevade</option>
                    <option value="Barreiro">Barreiro</option>
                    <option value="Santa Luzia">Santa Luzia</option>
                    <option value="Betim">Betim</option>
                    <option value="Ribeirão das Neves">Ribeirão das Neves</option>
                    <option value="Contagem">Contagem</option>
                    <option value="Lagoa">Lagoa</option>
                </select>
                <input type="submit" value="Cadastrar">
            </div>
        </div>
    </form>
</body>

</html>
