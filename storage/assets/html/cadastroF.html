<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de fornecedor</title>
</head>

<body>
    <header>
        <h1>CADASTRO FORNECEDOR</h1>
        <h3>Digite suas informações corretamente para realizarmos o seu cadastro.</h3>
        
    </header>


    <main>
        <form action="../php/cadF.php" method="post">
            <div class="quadro">
                <h2>Novo fornecedor</h2>
                <label for="">Nome:</label>
                <input type="text" name="nome" placeholder="Digite seu nome" required>

                <label for="Telefone">Telefone:</label>
                <input type="tel" name="telefone" placeholder="Digite seu telefone" maxlength="12" max="12" required>

                <label for=""> Endereço</label>
                <input type="text" name="endereco" id="" placeholder="Digite seu endereço" required>

                <label for="">CNPJ</label>
                <input type="text" name="cnpj" placeholder="Digite seu CNPJ" required>
                <br>
                <button type="submit" value="cadastrar">Cadastrar</button>
            </div>
        </form>
        <a href="../../index.html"> <button>Voltar para a aba inicial</button></a>
    </main>

</body>

</html>
