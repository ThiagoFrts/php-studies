<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Início</title>
  <link rel="stylesheet" href="../css/estilo.css">
</head>

<body class="pg-login">
  <div id="fundo1">
    <div id="formulario">
      <h1 class="login-titulo">Acesso ao sistema</h1>
      <p class="login-sub">Entre com seu usuário e senha.</p>
      <form name="form" action="../php/acesso.php" method="post" target="_self">
        <div class="campo">
          <label for="login">Usuário</label>
          <input type="text" id="login" name="login" autocomplete="username" />
        </div>
        <div class="campo">
          <label for="senha">Senha</label>
          <input type="password" id="senha" name="senha" autocomplete="current-password" />
        </div>
        <input type="submit" name="entrar" value="Entrar" />
      </form>
    </div>
  </div>
</body>

</html>
